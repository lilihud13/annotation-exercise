<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotation Exercise</title>
<style>
  :root{
    --navy:#1A3761; --card:#1E4270; --gold:#DBAD50; --teal:#2FA8A4;
    --ink:#16233a; --body:#33404f; --muted:#6b7684; --line:#dde2ea;
    --bg:#f4f6f9; --white:#fff; --good:#1b7f5a; --bad:#b4453c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;
         align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sp{flex:1}
  header .who{font-size:13px;opacity:.85}
  .bar{height:4px;background:var(--gold)}
  main{max-width:1060px;margin:0 auto;padding:22px}
  .wrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;
        box-shadow:0 1px 3px rgba(20,35,60,.06)}
  h2{font-size:21px;margin:0 0 6px}
  h3{font-size:14px;margin:22px 0 8px;color:var(--navy);text-transform:uppercase;
     letter-spacing:.6px}
  p.lede{color:var(--body);margin:0 0 18px}
  label.fl{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:var(--body)}
  input[type=text],select{font:inherit;padding:8px 10px;border:1px solid var(--line);
       border-radius:5px;background:#fff;color:var(--ink);width:100%}
  input[type=text]:focus,select:focus{outline:2px solid var(--teal);outline-offset:-1px}
  button{font:inherit;font-weight:600;padding:9px 18px;border-radius:5px;cursor:pointer;
         border:1px solid transparent;background:var(--navy);color:#fff}
  button:hover{filter:brightness(1.12)}
  button:disabled{opacity:.45;cursor:not-allowed;filter:none}
  button.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
  button.gold{background:var(--gold);color:#3a2b06}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  .note{background:#fdf6e6;border-left:3px solid var(--gold);padding:10px 14px;
        font-size:13px;color:#5a4a1e;border-radius:0 4px 4px 0;margin:14px 0}
  .chunk{background:#fbfcfe;border:1px solid var(--line);border-left:3px solid var(--teal);
         border-radius:0 6px 6px 0;padding:16px 18px;margin:4px 0 6px;font-size:15.5px;
         line-height:1.6;white-space:pre-wrap}
  .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .dims{border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .dim{border-top:1px solid var(--line);padding:11px 14px;display:grid;
       grid-template-columns:260px 1fr 160px;gap:12px;align-items:center}
  .dim:first-child{border-top:0}
  .dim.on{background:#f2faf9}
  .dim .nm{font-weight:600;font-size:13.5px}
  .dim .hint{font-size:11.5px;color:var(--muted);font-weight:400;display:block;margin-top:2px}
  .conf{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
  .conf button{padding:3px 0;width:26px;font-size:12px;background:#fff;color:var(--body);
               border:1px solid var(--line);font-weight:600}
  .conf button.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
  .steps{display:flex;gap:4px;margin:0 0 14px;flex-wrap:wrap}
  .steps span{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;
              font-size:12px;font-weight:600;background:#e6eaf1;color:var(--muted)}
  .steps span.done{background:var(--teal);color:#fff}
  .steps span.now{background:var(--navy);color:#fff;outline:2px solid var(--gold)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 14px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:8px 0 6px}
  .kpi{background:var(--navy);color:#fff;border-radius:6px;padding:14px 16px}
  .kpi .v{font-size:27px;font-weight:700;color:var(--gold);line-height:1.15}
  .kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.85}
  .kpi .s{font-size:11.5px;opacity:.75;margin-top:3px}
  .hit{color:var(--good);font-weight:600}
  .miss{color:var(--bad);font-weight:600}
  .tag{display:inline-block;background:#eef1f6;border:1px solid var(--line);border-radius:3px;
       padding:1px 6px;margin:2px 3px 2px 0;font-size:12px}
  .tag.ok{background:#e4f3ec;border-color:#b8ddc9;color:var(--good)}
  .tag.no{background:#fbe9e7;border-color:#f0c4bf;color:var(--bad)}
  details{margin:8px 0}
  summary{cursor:pointer;font-size:13px;color:var(--navy);font-weight:600}
  .small{font-size:12.5px;color:var(--muted)}
  .hide{display:none}
  @media(max-width:760px){.dim{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Annotation Exercise</h1>
  <span class="who" id="hdrGroup"></span>
  <span class="sp"></span>
  <span class="who" id="hdrWho"></span>
  <button class="ghost" id="btnFac" style="padding:5px 12px;font-size:12.5px">Facilitator</button>
</header>
<div class="bar"></div>
<main id="main"></main>

<script src="data.js"></script>
<script src="scoring.js"></script>
<script src="app.js"></script>
</body>
</html>
